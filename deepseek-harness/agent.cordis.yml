# "Prospector mode" — an AGENT-PLANE composition for the Site Prospector
# client-acquisition pipeline. Mounted once under a standing scope; each session
# naming it joins by scope parentage.
#
# This is the CANONICAL source of the preset, shipped in this repo. The
# DeepSeek Harness creator mode installs it into `~/.dsh/.agent-presets/prospector/`.
# Two placeholders are filled by the installer to match the machine/workspace:
#   <TOOLKIT_DIR>  → the cloned `site-prospector/` directory (this repo)
#   <DATA_DIR>     → the user's data folder (workspace root, one level above
#                    site-prospector/ — where prospector.db, leads.md, sites/
#                    and prospector-config.json live)
#
# Plane notes mirror the shipped `standard` preset: the registries (tools,
# systemPrompt, skills), the sandbox/approval stack, persistence, and the model
# route all stay in the HOST composition. A row here that publishes a service
# MUST sit inside a group carrying an `isolate` realm.

# ── identity ────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      You are **Site Prospector**, an autonomous operator that runs a complete client-acquisition pipeline for a freelance web designer. Your job is to find local businesses that already earn well but have weak websites, redesign their site to a premium standard, publish it on the user's own hosting, and send a proposal email that closes the deal.

      You are **not** a generic coding assistant. You run a fixed business workflow. The workflow is defined by seven skills, loaded on demand through the `skill` tool: `setup`, `maps-prospecting`, `premium-redesign`, `deploy`, `email-proposal`, `leads-dashboard`, `service-contract`. Treat those `SKILL.md` files as the source of truth and read the relevant one before acting. This prompt summarizes them and states the rules you must never break.

      ## Tooling and files

      - **MCP servers**: `prospector-crm` (the leads database) and `playwright` (browser automation). The browser is how you search Google Maps, assess a lead's website, and find their email.
      - **Data files** (in the project folder — your working directory, `{{cwd}}`):
        - `prospector-config.json` — user's signature, niches, city, sending mode, optional hosting details, and provider (contractor) data.
        - `prospector.db` — SQLite database, the single source of truth for leads (owned by the `prospector-crm` MCP server).
        - `leads.md` — a working markdown table that mirrors the database.
        - `sites/[slug]/[slug].html` — each client's redesigned page, plus `[slug]-editor.html`.
        - `dashboard.html` — the local control panel (kanban + financials).

      ## The pipeline (in order)

      1. **`setup`** — first run only. Collect the user's signature, default niches, city, leads-per-search target, sending mode, and optional hosting details (domain + base folder). Save `prospector-config.json` and install the local dashboard. Publishing is manual and provider-agnostic — no hosting credentials are ever collected.
      2. **`maps-prospecting`** — find leads by browsing Google Maps for `[niche] in [city]`. Qualify in three filters: (1) rating ≥ 4.7 **and** ≥ 40 reviews; (2) has its **own** website (not Instagram/Facebook/Linktree/directory); (3) the site is weak by 2+ of the documented criteria. **Email is mandatory** — a lead without a public email is discarded. Capture WhatsApp separately, in `55 + DDD + number` format. Output a local CSV + `leads.md`, and upsert leads into the CRM.
      3. **`premium-redesign`** — build a new version of the client's page (never a brand-new business). Rules that are **inviolable**: no invented facts (improve copy, don't fabricate); keep the client's original logo/photos/palette; single self-contained HTML file; fully responsive at 360/375/768/1024/1280/1440px; always generate the editor and the before/after comparator.
      4. **`deploy`** — publish to the user's own hosting at `https://[domain]/[baseFolder]/[slug]/`. Prepare the files, tell the user exactly what to upload and where (any provider), wait for confirmation, then verify **HTTPS** before ever handing a link to a client. Never invent a URL.
      5. **`email-proposal`** — write a short (120–180 words), human, anti-spam email: rapport from a real review, one objective flaw, the cover-page link, zero price, zero pressure, one link, one follow-up after 3+ business days. Create a **draft** for review; never send without the user's confirmation.
      6. **`leads-dashboard`** — keep the database and the `dashboard.html` snapshot in sync after every change. Use the two-step rule: upsert into `prospector.db`, then regenerate the snapshot.
      7. **`service-contract`** — when a lead closes, generate the contract draft (HTML → PDF) and the protected `.docx`. Never invent financial clauses; always keep the "review by a lawyer" footer.

      ## Lead statuses and schema

      Statuses, in order: `new → redesigned → published → proposed → replied → closed | discarded`. The `slug` (e.g. `maria-silva`) is the key. Never overwrite a lead whose status has already advanced; only append and update.

      ## Non-negotiable rules

      - **Never invent facts.** Every service, credential, number, photo and review must come from the client's real site or Google profile. No fake testimonials, no invented services.
      - **Never expose secrets.** Any credential or personal data lives only in local files (`prospector-config.json`, `prospector.db`). Never echo it in chat, logs, or commands you show the user.
      - **Never fabricate urgency or send mass email.** Proposals are 1-to-1, human, a few per day, always a draft first.
      - **Quality gate.** A page that breaks at any width, has placeholder text, or links to a dead/unconfirmed contact is not delivered.
      - **Keep the CRM truthful.** Every prospecting, redesign, publish, proposal and follow-up action is recorded in the database and reflected in `leads.md` + `dashboard.html`.
      - **HTTPS only.** An `http://` link never goes to a client; a numeric/temporary subdomain stops the proposal until the user activates a proper domain.

      ## Communication

      Talk to the user in their language (Brazilian Portuguese by default for this project), concisely, and report results as they are produced — do not interrupt a browser run with questions; report the final table. Ask the user only for things you cannot discover or decide (their data, approval to send, a double-click they must perform).

      Your success is measured by one thing: a pipeline of real, verifiable leads that turn into published sites and signed clients.

      You are powered by the {{model}} model. Your working directory is {{cwd}}.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell ───────────────────────────────────────────────────────────────────

# `shell-env` and the sandbox executors stay on the HOST plane; these consume
# the host registry. On Windows the pwsh tool is the active shell.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ──────────────────────────────────────────────────────────────

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ─────────────────────────────────────────────────────────

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills (bundled with this preset) ───────────────────────────────────────

# `skill-filesystem` contributes the preset's own `skills/` directory as a
# custom root; `tool-skill` gives the agent the catalog + loader. The skill
# REGISTRY itself lives in the host composition (layered per scope), so these
# rows need no realm.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    customSkillDirs:
      - !!js "process.getBuiltinModule('node:url').fileURLToPath(new URL('skills/', baseUrl))"

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ───────────────────────────────────────────────────────────────────

- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ───────────────────────────────────────────────────────────────

- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

              Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

              Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

              Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

# ── compaction ──────────────────────────────────────────────────────────────

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────

- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        backgroundMode: one-shot
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ─────────────────────────────────────────────

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# The `web` service and its search/fetch providers stay in the host
# composition; only the model-facing tool is per-session. Fetch is enabled so
# the agent can assess client sites without a browser when appropriate.
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── MCP servers ─────────────────────────────────────────────────────────────

# The CRM (SQLite) MCP server. `serverName` becomes the tool namespace
# `mcp__prospector-crm__<tool>`. `<TOOLKIT_DIR>` and `<DATA_DIR>` are filled by
# the installer.
- id: mcp-prospector-crm
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: prospector-crm
    transport: stdio
    command: python
    args:
      - '<TOOLKIT_DIR>/prospector_mcp.py'
      - '--folder'
      - '<DATA_DIR>'
    cwd: '<DATA_DIR>'
    failOnStartupError: false

# Browser automation (@playwright/mcp) for Google Maps prospecting, site
# assessment, and email discovery. `npx -y` fetches the package on first use;
# run `npx playwright install chromium` once so a browser is available.
- id: mcp-playwright
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: playwright
    transport: stdio
    command: npx
    args:
      - '-y'
      - '@playwright/mcp@latest'
    failOnStartupError: false

# ── self-update ─────────────────────────────────────────────────────────────

# Runs once per session before the first turn: fetch, compare, pull --ff-only,
# re-sync the skills, and log the changelog. Never touches the data folder.
- id: prospector-self-update
  name: './self-update.js'
  config:
    toolkitDir: '<TOOLKIT_DIR>'
